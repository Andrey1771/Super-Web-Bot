# Сборка образов сайта и публикация в GitHub Container Registry (ghcr.io).
# Сервер ничего не собирает: deploy/update.sh скачивает отсюда готовые образы.
#   ветка main  → теги latest и sha-<коммит> (по sha можно откатиться: IMAGE_TAG в .env сервера);
#   pull request → только сборка, без публикации — проверка, что Dockerfile не сломан.
name: images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: Dockerfile.backend
          - name: bot
            dockerfile: Dockerfile.bot
          - name: nginx
            dockerfile: Dockerfile.nginx
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имя репозитория в ghcr — только строчными буквами (Andrey1771 → andrey1771).
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/super-web-bot-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
