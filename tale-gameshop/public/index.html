<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Цвет адресной строки на мобильных. Совпадает с фиолетовым тела лягушки
         и с theme_color в manifest.json — раньше здесь оставался чёрный из шаблона CRA. -->
    <meta name="theme-color" content="#6e2cf5" />
    <!-- Язык страницы выставляется до первого кадра: сохранённый выбор, иначе язык браузера.
         Та же логика, что в site-preferences.ts (readLang); без этого первый кадр всегда английский. -->
    <script>
      (function () {
        var supported = ["en", "ru", "uk", "pl"];
        var lang = null;
        // Ссылка на языковую версию (?lang=ru из hreflang или карты сайта) главнее сохранённого выбора.
        try { var fromQuery = new URLSearchParams(location.search).get("lang"); if (supported.indexOf(fromQuery) >= 0) lang = fromQuery; } catch (e) {}
        if (!lang) { try { lang = localStorage.getItem("site_lang"); } catch (e) {} }
        if (supported.indexOf(lang) < 0) {
          var candidates = (navigator.languages || []).concat([navigator.language || ""]);
          lang = null;
          for (var i = 0; i < candidates.length && !lang; i++) {
            var code = String(candidates[i]).toLowerCase().split("-")[0];
            if (supported.indexOf(code) >= 0) lang = code;
          }
        }
        document.documentElement.lang = lang || "en";
      })();
    </script>
    <meta
      name="description"
      content="Tale Shop — curated PC games with secure checkout and instant key delivery."
    />
    <script src="/app-config.js"></script>
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Tale Shop</title>
    <style>
      /* Первый экран — каркас САМОЙ страницы, а не фирменная заставка.
         Полноэкранная карточка с логотипом на фиолетовом сиянии решала не ту задачу: она
         появлялась на секунду и исчезала, и это читалось как сбой, а не как загрузка. Чем
         быстрее становился сайт, тем нелепее выглядело окно — заявка на событие там, где
         событие длится мгновение.
         Здесь вместо окна сразу рисуется то, чем страница станет: та же шапка на том же
         месте и форма первого экрана под ней. Смысл только в совпадении: пока заставка
         гаснет, она полупрозрачна и сквозь неё видно уже отрисованную страницу. Всё, что
         стоит не там же, где в живой вёрстке, в этот момент двоится.
         Поэтому размеры взяты не на глаз, а из живой шапки и index.css: ряды 58px и 43px,
         контейнер 1320px с полями 32px и теми же переломами, логотип 42px. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #f6f7fb;
        opacity: 1;
        /* Короткое затухание, а не плавное. Длительность перехода — это ровно то время,
           которое зритель видит обе композиции сразу. 120мс снимают резкость переключения
           и не успевают прочитаться как двоение. */
        transition: opacity .12s ease;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #boot-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Шапка: два ряда, как у живой .site-header — 58px основного и 43px навигации,
         вместе 101px. Раньше здесь был один ряд 60px, и нижняя граница белого поля
         прыгала на 41px. */
      .boot-header {
        background: #ffffff;
        box-shadow: rgba(87, 68, 144, .08) 0 6px 20px 0;
      }
      .boot-row {
        display: flex;
        align-items: center;
      }
      .boot-row.is-primary { height: 58px; }
      .boot-row.is-nav {
        height: 43px;
        border-top: 1px solid #f0ecff;
      }
      /* Тот же контейнер, что .container в index.css. Раньше стояло просто padding: 0 20px
         без max-width: на экране 1900px логотип заставки оказывался на 295px левее живого,
         и при гашении было видно два логотипа в разных местах. */
      .boot-inner {
        display: flex;
        align-items: center;
        gap: 24px;
        width: 100%;
        max-width: 1320px;
        margin: 0 auto;
        padding: 0 32px;
      }
      /* Витрина шире шапки — ровно как .container-wide. */
      .boot-wrap {
        width: 100%;
        max-width: 1440px;
        margin: 0 auto;
        padding: 0 32px;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .boot-logo {
        /* Как в живой шапке, вместе с компенсацией пустого правого края знака. */
        height: 42px;
        width: auto;
        object-fit: contain;
        margin-right: -6px;
      }
      .boot-name {
        font-size: 20px;
        font-weight: 800;
        color: #3b2c66;
        letter-spacing: -.01em;
      }
      /* Заглушки самой шапки не мерцают: это не содержимое, которое подгружается, а
         органы управления, которые появятся целиком. Мерцает только тело страницы. */
      .boot-search {
        flex: 1 1 auto;
        max-width: 520px;
        height: 46px;
        border-radius: 999px;
        background: #f3f0ff;
      }
      .boot-tools {
        margin-left: auto;
        width: 476px;
        height: 38px;
        border-radius: 999px;
        background: #f3f0ff;
      }
      .boot-nav-links {
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .boot-link {
        height: 12px;
        border-radius: 999px;
        background: #f3f0ff;
      }
      .boot-trust {
        margin-left: auto;
        width: 168px;
        height: 12px;
        border-radius: 999px;
        background: #f3f0ff;
      }
      .boot-body { padding-top: 40px; }
      /* Форма первого экрана — одна широкая панель, и одна на все маршруты.

         Сначала здесь стояла сетка карточек, потом — выбор между сеткой и панелью по
         адресу. От выбора отказались: каталог совпасть не может. На 1280px его карточки
         начинаются на x=336 (слева колонка фильтров) и на y=333 (сверху заголовок и
         панель сортировки), а на 700px фильтры разворачиваются во всю ширину и сетка
         уезжает на y=1448. Повторить это — значит перенести саму страницу каталога в
         index.html и потом чинить её в двух местах.

         Панель же не притворяется конкретной раскладкой: на главной она ложится ровно
         на .hero-stage, на остальных страницах просто отмечает область содержимого.
         Дальше форму рисует сам маршрут — у каталога есть свои скелетоны в React. */
      .boot-hero {
        /* Пропорции сняты с живой .hero-stage на четырёх ширинах, а не подобраны:
           1900px — 2.32, 1024px — 1.20, 900px — 1.15, 480px — 0.54. Ниже 1024px витрина
           складывается в колонку и резко вытягивается, поэтому одной пропорцией не
           обойтись — на телефоне блок оказался бы вчетверо короче настоящего. */
        aspect-ratio: 1376 / 592;
        border-radius: 24px;
        display: block;
        background: linear-gradient(90deg, #f5f3ff 0%, #ece8ff 50%, #f5f3ff 100%);
        background-size: 200% 100%;
        animation: boot-shimmer 1.5s linear infinite;
      }
      @keyframes boot-shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      /* Переломы контейнера — те же, что у --container-padding в tokens.css. */
      @media (max-width: 1200px) {
        .boot-inner, .boot-wrap { padding: 0 24px; }
      }
      /* Ниже 1180px живая шапка прячет ряд навигации, поиск и кнопки входа и показывает
         бургер (см. tale-gameshop-header.css). Заставка обязана прятать их тоже. */
      @media (max-width: 1180px) {
        .boot-row.is-primary { height: 60px; }
        .boot-row.is-nav,
        .boot-search { display: none; }
        .boot-tools { width: 96px; }
      }
      @media (max-width: 992px) {
        .boot-inner, .boot-wrap { max-width: 100%; padding: 0 20px; }
      }
      @media (max-width: 768px) {
        .boot-inner, .boot-wrap { padding: 0 16px; }
      }
      @media (max-width: 1024px) {
        .boot-hero { aspect-ratio: 1.2 / 1; }
      }
      @media (max-width: 768px) {
        .boot-hero { aspect-ratio: 0.75 / 1; }
      }
      @media (max-width: 600px) {
        .boot-hero { aspect-ratio: 0.55 / 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash { transition: none; }
        .boot-hero { animation: none; }
      }
    </style>


  </head>
