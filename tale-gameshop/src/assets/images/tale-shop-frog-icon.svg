<?xml version="1.0" encoding="UTF-8"?>
<!--
  Иконочный вариант: одна лягушка, квадратная рамка, без искорки.

  Искорка в мелком размере перестаёт читаться как деталь и превращается в случайную
  точку сбоку, поэтому здесь её нет. Рамка квадратная и построена вокруг центра самой
  лягушки — знак не смещается в круглых аватарках, плитках приложения и favicon.

  Для favicon, PWA-иконки и свёрнутой колонки админки. В остальных местах — основной
  tale-shop-frog.svg.

  Отличия от tale-shop-frog.svg ровно два: удалён <path id="sparkle"> и другой viewBox.
  Геометрия общая, так что правку в основном знаке нужно повторить и здесь.
-->
