# Системный nginx сервера → демо-сайт в docker (127.0.0.1:8081). Сервер общий: 80/443 держит этот nginx для
# всех сайтов, TLS для домена демо выпускает certbot --nginx (он сам допишет в этот файл listen 443 и сертификат).
#
#   sudo cp deploy/demo/host-nginx.conf /etc/nginx/sites-available/taleshop-demo
#   sudo sed -i 's/DEMO_DOMAIN/ваш-домен/' /etc/nginx/sites-available/taleshop-demo
#   sudo ln -s /etc/nginx/sites-available/taleshop-demo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ваш-домен
server {
    listen 80;
    listen [::]:80;
    server_name DEMO_DOMAIN;

    # Загрузки в админке демо (обложки, медиа).
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Адрес посетителя и схема: nginx демо доверяет им (TALESHOP_TRUSTED_PROXY) — по ним считаются
        # лимиты частоты и ставится Secure у cookie.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
