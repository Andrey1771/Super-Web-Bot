parent=keycloak.v2
import=common/keycloak

# Tale Shop look: css/tale-shop.css + js/tale-shop.js on top of keycloak.v2.
# Keycloak caches theme resources for 30 days under a fixed URL: bump ?v= on every change.
# It also keeps gzip copies inside the container (data/tmp/kc-gzip-cache): after updating the theme
# recreate the container (up -d --force-recreate --no-deps keycloak), a plain restart serves stale files.
styles=css/styles.css css/tale-shop.css?v=7
scripts=js/tale-shop.js?v=7
