services:
  # Сервис "frontend" удалён как рудимент: фронт собирается внутри образа nginx
  # (Dockerfile.nginx, multi-stage), отдельный контейнер собирал его второй раз впустую.

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      - ASPNETCORE_URLS=http://+:7002
      # Имя переменной должно совпадать с конфигом, который реально читает код: ConnectionStrings:MongoDb
      - ConnectionStrings__MongoDb=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      # Keycloak: issuer (внешний, как видит браузер) и адрес метаданных (внутренний, как видит бэкенд)
      - Keycloak__Uri=${KEYCLOAK_PUBLIC_URL:-http://localhost:8088}
      - Keycloak__Realm=TaleShop
      - Keycloak__Audience=account
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/TaleShop/.well-known/openid-configuration
      # Admin-API Keycloak для страницы Security (сервисный аккаунт tale-shop-admin, ходит изнутри сети)
      - Keycloak__Admin__BaseUrl=http://keycloak:8080
      - Keycloak__Admin__Realm=TaleShop
      - Keycloak__Admin__ClientId=tale-shop-admin
      # Secret comes from .env (must match the client secret in keycloak/import/TaleShop-realm.json)
      - Keycloak__Admin__ClientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - Keycloak__Admin__PublicClientId=tale-shop-app
      # Внешний URL, куда Keycloak вернёт пользователя после действия из письма (2FA/verify/reset)
      - Keycloak__Admin__SecurityRedirectUri=${PUBLIC_URL:-http://localhost}/account/security
      # Внешний (браузерный) адрес account-консоли Keycloak для управления 2FA
      - Keycloak__Admin__AccountConsoleUrl=${KEYCLOAK_PUBLIC_URL:-http://localhost:8088}/realms/TaleShop/account
      # Восстановление доступа: письма шлём через mailhog, ссылки в письмах — на внешний адрес сайта
      - Recovery__SmtpHost=mailhog
      - Recovery__SmtpPort=1025
      - Recovery__PublicBaseUrl=${PUBLIC_URL:-http://localhost}
      - Recovery__WaitingPeriodHours=72
      - SupportChat__OllamaBaseUrl=http://host.docker.internal:11434
      # Public site URLs — set PUBLIC_URL in .env to your real domain (defaults to localhost for dev).
      - MainUrl=${PUBLIC_URL:-http://localhost}
      - FrontendConfiguration__Uri=${PUBLIC_URL:-http://localhost}
      - JwtSettings__Issuer=${PUBLIC_URL:-http://localhost}
      - JwtSettings__Audience=${PUBLIC_URL:-http://localhost}
      - BotConfiguration__BotWebhookUrl=${PUBLIC_URL:-http://localhost}/api/Telegram
      # Application secrets — sourced from .env (gitignored), never from committed appsettings.
      - BotConfiguration__BotToken=${BOT_TOKEN}
      - BotConfiguration__SecretToken=${BOT_WEBHOOK_SECRET}
      # Курс пересчёта цены в Telegram Stars (XTR) для оплаты в боте. Пусто = 50 (демо-ставка).
      - BotPayments__StarsPerUsd=${STARS_PER_USD:-50}
      # BTCPay Server (крипто-оплата, testnet DEMO). Все пустые = фича выключена.
      # Свой инстанс: https://docs.btcpayserver.org/Docker/ (testnet), API-ключ с правами btcpay.store.cancreateinvoice.
      - BtcPay__BaseUrl=${BTCPAY_URL}
      - BtcPay__ApiKey=${BTCPAY_API_KEY}
      - BtcPay__StoreId=${BTCPAY_STORE_ID}
      - BtcPay__WebhookSecret=${BTCPAY_WEBHOOK_SECRET}
      - JwtSettings__SecretKey=${JWT_SECRET}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY}
      # Подписной секрет вебхука (whsec_…). Из `stripe listen` (локально) или Dashboard → Webhooks (боевой). Пусто = вебхук отклоняется.
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET}
      # Cloudflare Turnstile (bot check on chat session creation). Empty = disabled.
      - SupportChat__TurnstileSiteKey=${TURNSTILE_SITE_KEY}
      - SupportChat__TurnstileSecretKey=${TURNSTILE_SECRET_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7002:7002"
    volumes:
      # Загруженные файлы (аватары и т.п.) должны переживать пересборку контейнера.
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      - mongo1
      - mongo2
      - mongo3
      - keycloak
    networks:
      - app_network

  # Бот-сервис: отдельный контейнер, единственный держит токен Telegram. Общается с сайтом
  # только через Mongo (event-outbox). nginx направляет сюда /api/Telegram, /api/admin/bot,
  # /api/miniapp, /api/account/telegram.
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: always
    environment:
      - ASPNETCORE_URLS=http://+:7003
      - ConnectionStrings__MongoDb=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      # Keycloak (проверка admin/аккаунт токенов) — как у backend
      - Keycloak__Uri=${KEYCLOAK_PUBLIC_URL:-http://localhost:8088}
      - Keycloak__Realm=TaleShop
      - Keycloak__Audience=account
      - Keycloak__MetadataAddress=http://keycloak:8080/realms/TaleShop/.well-known/openid-configuration
      - JwtSettings__Issuer=${PUBLIC_URL:-http://localhost}
      - JwtSettings__Audience=${PUBLIC_URL:-http://localhost}
      - JwtSettings__SecretKey=${JWT_SECRET}
      - MainUrl=${PUBLIC_URL:-http://localhost}
      # Telegram-бот
      - BotConfiguration__BotWebhookUrl=${PUBLIC_URL:-http://localhost}/api/Telegram
      - BotConfiguration__BotToken=${BOT_TOKEN}
      - BotConfiguration__SecretToken=${BOT_WEBHOOK_SECRET}
      - BotPayments__StarsPerUsd=${STARS_PER_USD:-50}
    depends_on:
      - mongo1
      - mongo2
      - mongo3
      - keycloak
    networks:
      - app_network

  mongo1:
    image: mongo:latest
    restart: always
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongodb_data1:/data/db
    ports:
      - "27017:27017"
    networks:
      - app_network

  mongo2:
    image: mongo:latest
    restart: always
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongodb_data2:/data/db
    networks:
      - app_network

  mongo3:
    image: mongo:latest
    restart: always
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongodb_data3:/data/db
    networks:
      - app_network

  mongo-init:
    image: mongo:latest
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    networks:
      - app_network
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      mongosh --host mongo1:27017 --eval 'rs.initiate({_id: \"rs0\", members: [{ _id: 0, host: \"mongo1:27017\" }, { _id: 1, host: \"mongo2:27017\" }, { _id: 2, host: \"mongo3:27017\" }]})';
      exit 0;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    restart: always
    # recovery-codes — preview-фича Keycloak: включает backup-коды (kc_action=CONFIGURE_RECOVERY_AUTHN_CODES).
    # Required action регистрируется при создании realm, поэтому после включения фичи контейнер надо
    # пересоздать: docker compose up -d --force-recreate keycloak (данные не персистятся, realm импортнётся заново).
    command: start-dev --import-realm --features=recovery-codes
    environment:
      # Учётка админ-консоли Keycloak (master realm) — http://localhost:8088/admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Публичный адрес (issuer токенов) — как его видит браузер
      - KC_HOSTNAME=http://localhost:8088
      # JWKS/backchannel отдаются по адресу запроса → бэкенд из контейнера получит keycloak:8080
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    ports:
      - "8088:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      # Кастомная тема логина монтируется рядом со встроенными (не перекрывая их — нужен parent keycloak.v2)
      - ./keycloak/themes/tale-shop:/opt/keycloak/themes/tale-shop:ro
    networks:
      - app_network

