  #    KEYCLOAK_ADMIN_PASSWORD: $KEYCLOAK_ADMIN_PASSWORD
  #    KEYCLOAK_FRONTEND_URL: $KEYCLOAK_FRONTEND_URL
      # SMTP Configuration
      #KC_MAIL_SMTP_SERVER: $SMTP_SERVER
      #KC_MAIL_SMTP_PORT: $SMTP_PORT
      #KC_MAIL_SMTP_FROM: $SMTP_FROM
      #KC_MAIL_SMTP_USER: $SMTP_USER
      #KC_MAIL_SMTP_PASSWORD: $SMTP_PASSWORD
      #KC_MAIL_SMTP_AUTH: true
      #KC_MAIL_SMTP_SSL: true


  # Dev-ловушка писем: Keycloak отправляет письма (2FA-setup, верификация, сброс пароля) сюда.
  # Веб-интерфейс с письмами — http://localhost:8025. Реальная почта в проде настраивается отдельно.
  mailhog:
    image: mailhog/mailhog:latest
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - app_network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - bot
    #  - keycloak
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
  #keycloak-network:
  #  driver: bridge

volumes:
  mongodb_data1:
  mongodb_data2:
  mongodb_data3:
  uploads_data:
