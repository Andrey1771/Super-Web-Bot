# Базовое описание стека — общее для стенда и продакшена. Само по себе не запускается:
#   стенд (эта машина):  docker compose up -d
#                        compose сам добавит docker-compose.override.yml — сборку образов
#                        из исходников, реплику Mongo из трёх узлов, Mailpit, отладочные порты;
#   продакшен (сервер):  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#                        (или COMPOSE_FILE в .env сервера, см. docs/deploy.md) — готовые образы
#                        из ghcr.io, https, Mongo с паролями, резервные копии.
#
# Портов наружу здесь нет: в списке ports compose складывает значения из всех файлов, а убрать
# порт, объявленный в базе, нельзя. Поэтому каждый файл публикует своё.

# Ротация логов для всех сервисов. По умолчанию Docker пишет json-логи без ограничения, и
# за месяцы работы они съедают диск сервера целиком.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ghcr.io/andrey1771/super-web-bot-backend:${IMAGE_TAG:-latest}
    restart: always
    logging: *logging
    environment:
      - ASPNETCORE_URLS=http://+:7002
      # Имя переменной должно совпадать с конфигом, который реально читает код: ConnectionStrings:MongoDb.
      # По умолчанию — реплика стенда без паролей; продакшен задаёт свою строку с логином.
      - ConnectionStrings__MongoDb=${MONGO_URL:-mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0}
      - ConnectionStrings__Name=${MONGO_DB:-SteamShopDatabase}
      # Валюты витрины. Базовая — USD; каждая валюта из списка появляется в переключателе в шапке,
      # а стартовая угадывается по региону браузера. Курс — стартовый (ManualRates), дальше его
      # правит админка (Currencies & FX) или суточный импорт, если задан Storefront__Fx__Source__Url.
      - Storefront__BaseCurrency=USD
      - Storefront__SupportedCurrencies__0=USD
      - Storefront__SupportedCurrencies__1=EUR
      - Storefront__Fx__ManualRates__EUR=0.92
      - Storefront__Fx__Rounding__EUR=NinetyNine
      # Суточный импорт курсов (Hangfire) + кнопка «Import now» в Currencies & FX. Бесплатный
      # источник без ключа; {base} подставляется базовой валютой. Скачок больше MaxChangePercent
      # гард отклонит и оставит прежний курс — см. FxRateService.
      - Storefront__Fx__Source__Url=https://open.er-api.com/v6/latest/{base}
      # Реквизиты продавца для юридических документов витрины. Значения по умолчанию лежат
      # в appsettings.json (секция Legal) и заполнены вымышленной компанией для демо.
      # Здесь их можно перекрыть, не трогая образ: любое поле секции задаётся переменной
      # с двойным подчёркиванием вместо двоеточия. Раскомментируйте нужные и подставьте свои.
      # - Legal__Entity=${LEGAL_ENTITY:-}
      # - Legal__RegistrationCountry=${LEGAL_REGISTRATION_COUNTRY:-}
      # - Legal__RegistrationNumber=${LEGAL_REGISTRATION_NUMBER:-}
      # - Legal__Address=${LEGAL_ADDRESS:-}
      # - Legal__SupportEmail=${LEGAL_SUPPORT_EMAIL:-}
      # - Legal__PrivacyEmail=${LEGAL_PRIVACY_EMAIL:-}
      # - Legal__GoverningLawCountry=${LEGAL_GOVERNING_LAW_COUNTRY:-}
      # Переводы реквизитов — той же секцией с языком и полем: Legal__I18n__<язык>__<Поле>.
      # - Legal__I18n__ru__GoverningLawCountry=${LEGAL_GOVERNING_LAW_COUNTRY_RU:-}
      # Пока текст не вычитал юрист, держите true: витрина покажет пометку «черновик».
      # - Legal__Draft=true
      # Keycloak живёт на том же домене под /auth (его проксирует nginx).
      # Uri — issuer токенов, как его видит браузер; MetadataAddress — тот же Keycloak изнутри сети.
      - Keycloak__Uri=${PUBLIC_URL:-http://localhost}/auth
      - Keycloak__Realm=TaleShop
      - Keycloak__Audience=account
      - Keycloak__MetadataAddress=http://keycloak:8080/auth/realms/TaleShop/.well-known/openid-configuration
      # Admin-API Keycloak для страницы Security (сервисный аккаунт tale-shop-admin, ходит изнутри сети)
      - Keycloak__Admin__BaseUrl=http://keycloak:8080/auth
      - Keycloak__Admin__Realm=TaleShop
      - Keycloak__Admin__ClientId=tale-shop-admin
      # Секрет из .env; при первом запуске Keycloak тот же секрет попадает в клиент tale-shop-admin
      # (плейсхолдер в keycloak/import/TaleShop-realm.json).
      - Keycloak__Admin__ClientSecret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      - Keycloak__Admin__PublicClientId=tale-shop-app
      # Внешний URL, куда Keycloak вернёт пользователя после действия из письма (2FA/verify/reset)
      - Keycloak__Admin__SecurityRedirectUri=${PUBLIC_URL:-http://localhost}/account/security
      # Внешний (браузерный) адрес account-консоли Keycloak для управления 2FA
      - Keycloak__Admin__AccountConsoleUrl=${PUBLIC_URL:-http://localhost}/auth/realms/TaleShop/account
      # Почта: одна SMTP-настройка на все письма сайта (заказы, рассылка, восстановление доступа,
      # поддержка). По умолчанию — Mailpit стенда; в продакшене — почтовый сервис с логином и
      # STARTTLS на порту 587 (465 клиент .NET не умеет — бэкенд откажется стартовать).
      - Mail__SmtpHost=${SMTP_HOST:-mailpit}
      - Mail__SmtpPort=${SMTP_PORT:-1025}
      - Mail__SmtpUsername=${SMTP_USERNAME:-}
      - Mail__SmtpPassword=${SMTP_PASSWORD:-}
      - Mail__SmtpUseTls=${SMTP_USE_TLS:-false}
      - Mail__FromAddress=${MAIL_FROM:-no-reply@taleshop.local}
      - Mail__PublicBaseUrl=${PUBLIC_URL:-http://localhost}
      # Восстановление доступа: ссылки в письмах — на внешний адрес сайта
      - Recovery__PublicBaseUrl=${PUBLIC_URL:-http://localhost}
      - Recovery__FromAddress=${MAIL_FROM:-no-reply@taleshop.local}
      - Recovery__WaitingPeriodHours=72
      # Письмо «расскажите, как вам игра» через неделю после выдачи ключа. Выключено, пока
      # не выставите true: рассылка идёт живым покупателям, и включаться сама она не должна.
      # DelayDays — через сколько дней спрашивать, MaxAgeDays — насколько старые заказы ещё
      # трогать (при первом включении эта граница не даёт разослать письма по всей истории).
      - ReviewInvites__Enabled=${REVIEW_INVITES_ENABLED:-false}
      - ReviewInvites__DelayDays=${REVIEW_INVITES_DELAY_DAYS:-7}
      - ReviewInvites__MaxAgeDays=${REVIEW_INVITES_MAX_AGE_DAYS:-30}
      # Как часто перечитывать настройки сайта из базы (нужно при нескольких репликах).
      - SiteSettings__RefreshSeconds=${SITE_SETTINGS_REFRESH_SECONDS:-30}
      # Год основания магазина для страницы «О нас». Посчитать неоткуда — знаешь только ты.
      # Пусто — плитки «Founded» на странице просто нет.
      - About__FoundedYear=${ABOUT_FOUNDED_YEAR:-}
      # Модель за чатом поддержки: deepseek (внешний API) или ollama (локально).
      # По умолчанию deepseek. Ollama остаётся резервом при любом выборе — на неё чат уходит
      # сам, если ключа нет, внешний API недоступен или исчерпан дневной бюджет, — поэтому
      # адрес нужен всегда. Вернуться на локальную модель: SUPPORT_CHAT_PROVIDER=ollama.
      - SupportChat__OllamaBaseUrl=${OLLAMA_URL:-http://host.docker.internal:11434}
      - SupportChat__Provider=${SUPPORT_CHAT_PROVIDER:-deepseek}
      - SupportChat__DeepSeekApiKey=${DEEPSEEK_API_KEY:-}
      # Имя модели берётся из актуального прайса провайдера; reasoning-версию не используем.
      - SupportChat__DeepSeekModel=${DEEPSEEK_MODEL:-deepseek-chat}
      # Метка приложения в запросах: одним ключом могут пользоваться несколько наших проектов.
      - SupportChat__AppTag=${SUPPORT_CHAT_APP_TAG:-tale-shop-support}
      # Потолок расходов на ИИ-чат в сутки, $. По умолчанию 5: без потолка чат с ботами за прокси
      # тратит деньги без ограничения. 0 — без ограничения; при исчерпании чат уходит на Ollama.
      # Перекрывается и полем в админке (Settings).
      - SupportChat__DailyBudgetUsd=${SUPPORT_CHAT_DAILY_BUDGET_USD:-5}
      # Ящик, куда падает уведомление о передаче диалога человеку. Пусто — на адрес отправителя.
      - SupportChat__SpecialistEmail=${SUPPORT_SPECIALIST_EMAIL:-}
      # Доступ на ЧТЕНИЕ отчётов Google Analytics внутрь админки. К сбору данных отношения не
      # имеет: витрине хватает Measurement ID из настроек. Пусто — страница Analytics overview
      # честно скажет, что доступа нет, всё остальное работает как обычно.
      - Analytics__Google__ClientId=${GA_OAUTH_CLIENT_ID:-}
      - Analytics__Google__ClientSecret=${GA_OAUTH_CLIENT_SECRET:-}
      - Analytics__Google__RefreshToken=${GA_OAUTH_REFRESH_TOKEN:-}
      # Публичный адрес сайта — PUBLIC_URL в .env (на стенде по умолчанию http://localhost).
      - MainUrl=${PUBLIC_URL:-http://localhost}
      # Кому бот пишет о заказах и эскалациях. Личные идентификаторы владельца — держим
      # в .env, а не в appsettings.json: тот лежит в репозитории и уезжает на GitHub.
      - TelegramUsername=${TELEGRAM_ADMIN_USERNAME:-}
      - AdminChatId=${TELEGRAM_ADMIN_CHAT_ID:-}
      - FrontendConfiguration__Uri=${PUBLIC_URL:-http://localhost}
      - JwtSettings__Issuer=${PUBLIC_URL:-http://localhost}
      - JwtSettings__Audience=${PUBLIC_URL:-http://localhost}
      # Адрес вебхука Telegram. По умолчанию — публичный адрес сайта плюс /api/Telegram.
      # BOT_WEBHOOK_URL нужен, когда они не совпадают: например, локально сайт живёт на
      # localhost, а Telegram требует https и стучится через туннель.
      - BotConfiguration__BotWebhookUrl=${BOT_WEBHOOK_URL:-${PUBLIC_URL:-http://localhost}/api/Telegram}
      # Секреты приложения — только из .env (он не в git), никогда не из appsettings в репозитории.
      - BotConfiguration__BotToken=${BOT_TOKEN:-}
      - BotConfiguration__SecretToken=${BOT_WEBHOOK_SECRET:-}
      # Общий токен для служебных вызовов между нашими же сервисами (проверки здоровья).
      # Пустой — служебный вход закрыт, остаётся только вход по правам админа.
      - Internal__ServiceToken=${INTERNAL_SERVICE_TOKEN:-}
      # Курс пересчёта цены в Telegram Stars (XTR) для оплаты в боте. Пусто = 50 (демо-ставка).
      - BotPayments__StarsPerUsd=${STARS_PER_USD:-50}
      # BTCPay Server (крипто-оплата, testnet DEMO). Все пустые = фича выключена.
      # Свой инстанс: https://docs.btcpayserver.org/Docker/ (testnet), API-ключ с правами btcpay.store.cancreateinvoice.
      # Крипто-рельс выключен по решению: код и интеграция остались на месте, магазин их
      # не предлагает. Включается сюда же — BTCPAY_ENABLED=true вместе с ключами ниже.
      - BtcPay__Enabled=${BTCPAY_ENABLED:-false}
      - BtcPay__BaseUrl=${BTCPAY_URL:-}
      - BtcPay__ApiKey=${BTCPAY_API_KEY:-}
      - BtcPay__StoreId=${BTCPAY_STORE_ID:-}
      - BtcPay__WebhookSecret=${BTCPAY_WEBHOOK_SECRET:-}
      - JwtSettings__SecretKey=${JWT_SECRET}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-}
      - Stripe__PublishableKey=${STRIPE_PUBLISHABLE_KEY:-}
      # Подписной секрет вебхука (whsec_…). Из `stripe listen` (локально) или Dashboard → Webhooks (боевой). Пусто = вебхук отклоняется.
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-}
      # Cloudflare Turnstile (bot check on chat session creation). Empty = disabled.
      # Локально в .env стоят тестовые ключи Cloudflare (всегда пропускают): проверяется сама цепочка.
      # На сервере — только настоящие ключи сайта из панели Cloudflare, привязанные к домену.
      - SupportChat__TurnstileSiteKey=${TURNSTILE_SITE_KEY:-}
      - SupportChat__TurnstileSecretKey=${TURNSTILE_SECRET_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Загруженные файлы (аватары и т.п.) должны переживать пересборку контейнера.
      - uploads_data:/app/wwwroot/uploads
      # Ключи DataProtection переживают пересоздание контейнера и общие для реплик сервиса.
      - dp_keys_backend:/app/keys
    depends_on:
      - mongo1
      - keycloak
    networks:
      - app_network

  # Бот-сервис: отдельный контейнер, единственный держит токен Telegram. Общается с сайтом
  # только через Mongo (event-outbox). nginx направляет сюда /api/Telegram, /api/admin/bot,
  # /api/miniapp, /api/account/telegram.
  bot:
    image: ghcr.io/andrey1771/super-web-bot-bot:${IMAGE_TAG:-latest}
    restart: always
    logging: *logging
    environment:
      - ASPNETCORE_URLS=http://+:7003
      - ConnectionStrings__MongoDb=${MONGO_URL:-mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0}
      - ConnectionStrings__Name=${MONGO_DB:-SteamShopDatabase}
      # Keycloak (проверка admin/аккаунт токенов) — как у backend
      - Keycloak__Uri=${PUBLIC_URL:-http://localhost}/auth
      - Keycloak__Realm=TaleShop
      - Keycloak__Audience=account
      - Keycloak__MetadataAddress=http://keycloak:8080/auth/realms/TaleShop/.well-known/openid-configuration
      - JwtSettings__Issuer=${PUBLIC_URL:-http://localhost}
      - JwtSettings__Audience=${PUBLIC_URL:-http://localhost}
      - JwtSettings__SecretKey=${JWT_SECRET}
      - MainUrl=${PUBLIC_URL:-http://localhost}
      # Кому бот пишет о заказах и эскалациях. Личные идентификаторы владельца — держим
      # в .env, а не в appsettings.json: тот лежит в репозитории и уезжает на GitHub.
      - TelegramUsername=${TELEGRAM_ADMIN_USERNAME:-}
      - AdminChatId=${TELEGRAM_ADMIN_CHAT_ID:-}
      # Telegram-бот
      # Адрес вебхука Telegram. По умолчанию — публичный адрес сайта плюс /api/Telegram.
      # BOT_WEBHOOK_URL нужен, когда они не совпадают: например, локально сайт живёт на
      # localhost, а Telegram требует https и стучится через туннель.
      - BotConfiguration__BotWebhookUrl=${BOT_WEBHOOK_URL:-${PUBLIC_URL:-http://localhost}/api/Telegram}
      - BotConfiguration__BotToken=${BOT_TOKEN:-}
      - BotConfiguration__SecretToken=${BOT_WEBHOOK_SECRET:-}
      # Общий токен для служебных вызовов между нашими же сервисами (проверки здоровья).
      # Пустой — служебный вход закрыт, остаётся только вход по правам админа.
      - Internal__ServiceToken=${INTERNAL_SERVICE_TOKEN:-}
      - BotPayments__StarsPerUsd=${STARS_PER_USD:-50}
    volumes:
      # Ключи DataProtection: см. backend.
      - dp_keys_bot:/app/keys
    depends_on:
      - mongo1
      - keycloak
    networks:
      - app_network

  mongo1:
    image: mongo:8.2
    restart: always
    logging: *logging
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongodb_data1:/data/db
    networks:
      - app_network

  # База Keycloak: пользователи, пароли, сессии, настройки realm. Раньше Keycloak работал
  # в режиме разработки со встроенной H2 внутри контейнера, и каждое пересоздание контейнера
  # стирало всех пользователей. Версия 18 — та, на которой Keycloak 26.7 проверен.
  keycloak-db:
    image: postgres:18-alpine
    restart: always
    logging: *logging
    environment:
      - POSTGRES_DB=${KEYCLOAK_DB:-keycloak}
      - POSTGRES_USER=${KEYCLOAK_DB_USER:-keycloak}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      # С 18-й версии образ хранит данные в подкаталоге по версии, поэтому том — на уровень выше
      # (/var/lib/postgresql, а не /var/lib/postgresql/data).
      - keycloak_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app_network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: always
    logging: *logging
    # Боевой режим (start) и на стенде, и в продакшене: одинаковое поведение и данные в Postgres.
    # --import-realm создаёт realm TaleShop из keycloak/import при первом запуске на пустой базе;
    # если realm уже есть, файл не применяется (изменения в нём — через админ-консоль).
    # recovery-codes — preview-фича Keycloak: включает backup-коды (kc_action=CONFIGURE_RECOVERY_AUTHN_CODES).
    command: start --import-realm --features=recovery-codes
    environment:
      # Учётка админ-консоли Keycloak (master realm). Создаётся только при первом запуске на
      # пустой базе — потом смена пароля здесь ничего не меняет, только в самой консоли.
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB:-keycloak}
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER:-keycloak}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Один экземпляр — без кластерного кэша и поиска соседей.
      - KC_CACHE=local
      # Keycloak на том же домене, что и сайт, под /auth: nginx проксирует его как есть.
      # Публичный адрес (issuer токенов) — как его видит браузер.
      - KC_HOSTNAME=${PUBLIC_URL:-http://localhost}/auth
      - KC_HTTP_RELATIVE_PATH=/auth
      # Здоровье остаётся на management-порту без префикса: :9000/health/ready.
      - KC_HTTP_MANAGEMENT_RELATIVE_PATH=/
      # Схему и хост клиента берём из заголовков nginx (TLS снимает он).
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      # JWKS/backchannel отдаются по адресу запроса → бэкенд из контейнера получит keycloak:8080
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HEALTH_ENABLED=true
      # Значения для плейсхолдеров ${...} в keycloak/import/TaleShop-realm.json. Применяются
      # только при первом импорте realm, то есть на пустой базе Keycloak.
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      # Админ САЙТА (не админ-консоли Keycloak выше) — пользователь realm'а TaleShop.
      - TALESHOP_ADMIN_USER=${TALESHOP_ADMIN_USER:-admin}
      - TALESHOP_ADMIN_PASSWORD=${TALESHOP_ADMIN_PASSWORD:-admin}
      - TALESHOP_ADMIN_EMAIL=${TALESHOP_ADMIN_EMAIL:-admin@taleshop.local}
      # Почта Keycloak (подтверждение адреса, сброс пароля, настройка 2FA) — тот же SMTP, что у сайта.
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_AUTH=${SMTP_USERNAME:+true}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-false}
      - MAIL_FROM=${MAIL_FROM:-no-reply@taleshop.local}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      # Кастомная тема логина монтируется рядом со встроенными (не перекрывая их — нужен parent keycloak.v2)
      - ./keycloak/themes/tale-shop:/opt/keycloak/themes/tale-shop:ro
    # Готовность — по /health/ready на management-порту (KC_HEALTH_ENABLED выше).
    # curl в образе нет, поэтому HTTP-запрос делаем средствами самого шелла через /dev/tcp.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - app_network

  # Сайт: собранный фронт + обратный прокси на backend, bot и Keycloak (см. nginx/).
  nginx:
    image: ghcr.io/andrey1771/super-web-bot-nginx:${IMAGE_TAG:-latest}
    restart: always
    logging: *logging
    volumes:
      # Медиа игр (/uploads/steam) nginx отдаёт сам, прямо из тома — только чтение.
      - uploads_data:/srv/uploads:ro
    environment:
      # dev — http на 80-м порту; prod — домен, https и закрытая админ-консоль Keycloak.
      - NGINX_SITE=${NGINX_SITE:-dev}
      # Публичный ключ Stripe попадает в рантайм-конфиг фронта при старте контейнера.
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
    # Длинная форма: nginx не поднимается, пока Keycloak не станет healthy.
    # Иначе сайт начинает отдаваться раньше авторизации, фронт ловит отказ
    # check-sso и навсегда виснет на заставке (провайдер @react-keycloak при
    # неудачном init не выставляет initialized).
    depends_on:
      backend:
        condition: service_started
      bot:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  dp_keys_backend:
  dp_keys_bot:
  mongodb_data1:
  uploads_data:
  keycloak_db_data:
