# Маршруты сайта — общие для стенда и продакшена. Подключаются внутрь server из шаблона сайта.
# Сюда не попадают ни порты, ни домен, ни TLS: они различаются между окружениями.

    # Превышение лимита частоты (зоны — в nginx.conf) — JSON с пометкой edge: по ней витрина отличает
    # «подожди секунду» от отказов самого бэкенда (повторная отправка ключей раз в 10 минут, перебор
    # промокодов), которые повторять нельзя. Ответы бэкенда это правило не трогает: proxy_intercept_errors
    # выключен, его 429 уходят как есть.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"code":"RATE_LIMITED","edge":true,"message":"Too many requests. Please slow down."}';
    }

    # --- Keycloak (вход, регистрация, страницы аккаунта) ---
    # Тот же домен, путь /auth: браузеру не нужен отдельный адрес и сертификат, а тихая проверка
    # входа (check-sso в скрытом iframe) не упирается в блокировку сторонних cookie.
    # proxy_pass через переменную: nginx не резолвит keycloak при старте (иначе он падал бы,
    # пока Keycloak ещё поднимается) и передаёт путь как есть — Keycloak слушает с префиксом /auth.
    # ^~ обязателен: иначе regex-локация статики ниже перехватит его скрипты и стили (.js, .css).
    location ^~ /auth/ {
        # Только отправка форм и выдача токенов (POST); страницы и их стили этой зоной не считаются.
        limit_req zone=auth_write burst=10 nodelay;
        set $keycloak_upstream keycloak:8080;
        proxy_pass http://$keycloak_upstream;
    }

    # Карты исходников остаются в сборке для отладки, но наружу не отдаются.
    location ~* \.map$ {
        return 404;
    }

    # --- Бот-сервис (отдельный контейнер) ---
    # Всё, что касается Telegram, обслуживает bot, а не backend. nginx выбирает самый длинный
    # префикс, поэтому эти локации перехватывают свои пути раньше общего /api/ ниже.
    location /api/Telegram {
        set $bot_upstream bot:7003;
        proxy_pass http://$bot_upstream;
    }
    location /api/admin/bot/ {
        set $bot_upstream bot:7003;
        proxy_pass http://$bot_upstream;
    }
    location /api/miniapp/ {
        set $bot_upstream bot:7003;
        proxy_pass http://$bot_upstream;
    }
    location /api/account/telegram/ {
        set $bot_upstream bot:7003;
        proxy_pass http://$bot_upstream;
    }

    # Проксируем остальные запросы к API на бэкенд сайта.
    # Через переменную $backend_upstream nginx НЕ резолвит хост при старте (иначе [emerg] host not found,
    # если backend ещё не поднялся), а резолвит динамически по запросу через resolver выше —
    # это переживает и пересоздание контейнера backend (новый IP).
    # ВАЛЮТА И КЭШ. Валюта покупателя ездит только в строке запроса (?currency=), поэтому
    # попадает в ключ кэша сама собой — и nginx, и любой CDN разложат ответы по валютам.
    # Если когда-нибудь валюту начнут брать из cookie или своего заголовка, здесь обязан
    # появиться proxy_cache_key с этим значением и Vary в ответе: иначе первый покупатель
    # прогреет кэш своей валютой, и остальные увидят чужие цены. Это тот случай, когда
    # на сервере всё правильно, а ломается снаружи и невоспроизводимо.
    # Лимиты частоты: все запросы — 20 в секунду с запасом 40 на открытие страницы, меняющие — 5 в секунду.
    # Бот (/api/Telegram и др. выше) лимитов не получает: вебхуки Telegram приходят пачками с одних адресов.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=api_write burst=20 nodelay;
        set $backend_upstream backend:7002;
        proxy_pass http://$backend_upstream;
    }

    # Медиатека принимает видео до 300 МБ (RequestSizeLimit на бэкенде) — только здесь лимит больше общего.
    location ^~ /api/media/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=api_write burst=20 nodelay;
        client_max_body_size 310m;
        set $backend_upstream backend:7002;
        proxy_pass http://$backend_upstream;
    }
    location ^~ /api/admin/media/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=api_write burst=20 nodelay;
        client_max_body_size 310m;
        set $backend_upstream backend:7002;
        proxy_pass http://$backend_upstream;
    }

    # Медиа игр из Steam (скриншоты, трейлеры HLS, картинки описаний) — прямо с диска, без бэкенда:
    # это самая тяжёлая часть трафика. Том uploads подключён к nginx только на чтение (docker-compose.yml).
    # Имена файлов неизменны (скачанное не перезаписывается), поэтому кэш браузера — надолго.
    location ^~ /uploads/steam/ {
        # Только кусочки трейлеров: запас 300 — рывок на старте у нескольких роликов разом (~70 кусочков на ролик).
        limit_req zone=video burst=300 nodelay;
        alias /srv/uploads/steam/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/iso.segment m4s;
            image/webp webp;
            image/avif avif;
            image/gif gif;
            image/jpeg jpg jpeg;
            image/png png;
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/security-headers.conf;
    }

    # Загруженные файлы (аватары и т.п.) отдаёт бэкенд из wwwroot/uploads.
    # ^~ обязателен: иначе regex-локация статики (\.webp$ и т.п.) перехватывает путь и nginx отдаёт 404.
    location ^~ /uploads/ {
        limit_req zone=media burst=300 nodelay;
        set $backend_upstream backend:7002;
        proxy_pass http://$backend_upstream;
    }

    # Файлы для поисковых роботов отдаёт бэкенд, а не статика фронта: карта сайта должна
    # содержать актуальные товары и статьи, а robots.txt — абсолютный адрес этой карты.
    # Точное совпадение (=) обязательно: иначе их перехватит общая локация статики ниже.
    location = /sitemap.xml {
        set $backend_upstream backend:7002;
        proxy_pass http://$backend_upstream;
    }
    location = /robots.txt {
        set $backend_upstream backend:7002;
        proxy_pass http://$backend_upstream;
    }

    # --- Статистика со своего домена ---
    #
    # Блокировщики режут по адресу: googletagmanager.com/gtag/js и google-analytics.com/g/collect
    # есть в любом списке фильтров, и у половины посетителей счётчик не грузится вовсе. Отдаём то
    # же самое со своего домена — для расширения это обычные запросы к сайту.
    #
    # /st/t — сам скрипт счётчика, /st/c — контейнер GTM, /st/g/collect — приём событий
    # (адрес складывает сам gtag из transport_url, см. analytics-client.ts).
    #
    # Хост в переменной специально: с литералом nginx резолвит его при старте и при недоступном
    # DNS падает с [emerg] host not found — вместе со всем сайтом. Через переменную резолвинг
    # идёт по запросу, через resolver выше.
    #
    # Полного обхода это не даёт: часть списков ловит и характерные параметры запроса (tid=G-).
    # Что не блокируется совсем — отправка с сервера, как у покупок (Ga4PurchaseAnalytics).
    location = /st/t {
        set $gtm_host www.googletagmanager.com;
        proxy_pass https://$gtm_host/gtag/js$is_args$args;
        proxy_set_header Host www.googletagmanager.com;
        proxy_ssl_server_name on;
    }

    location = /st/c {
        set $gtm_host www.googletagmanager.com;
        proxy_pass https://$gtm_host/gtm.js$is_args$args;
        proxy_set_header Host www.googletagmanager.com;
        proxy_ssl_server_name on;
    }

    # ^~ обязателен: иначе regex-локация статики ниже перехватит путь.
    # X-Forwarded-For идёт из общих настроек выше — по нему Google определяет страну
    # посетителя, иначе вся аудитория оказалась бы из страны сервера.
    location ^~ /st/ {
        set $ga_host www.google-analytics.com;
        rewrite ^/st/(.*)$ /$1 break;
        proxy_pass https://$ga_host;
        proxy_set_header Host www.google-analytics.com;
        proxy_ssl_server_name on;
    }

    # Никогда не кешируем SPA-оболочку и рантайм-конфиг — иначе браузер застревает на старой сборке.
    # Хешированные бандлы (bundle.<hash>.js) кешируются долго правилом ниже — у них меняется имя.
    location = /index.html {
        expires off;
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }
    location = /app-config.js {
        expires off;
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/security-headers.conf;
    }

    # Отдельного раздела /software больше нет: софт — режим каталога /games?type=software, товар — /games/{slug}.
    # Старые адреса (закладки, письма, индекс поисковиков) — постоянный редирект. rewrite с «?» в замене
    # дописывает исходные параметры через «&», поэтому /software?onSale=1 не теряет фильтр.
    # ^~ — чтобы общая regex-локация статики ниже не перехватила адрес.
    location ^~ /software {
        absolute_redirect off;
        rewrite ^/software/?$ /games?type=software permanent;
        rewrite ^/software/category/([^/]+)/?$ /games?type=software&softwareCategory=$1 permanent;
        rewrite ^/software/([^/]+)/?$ /games/$1 permanent;
        try_files $uri /index.html;
    }

    # Основной блок, который обрабатывает все запросы
    location / {
        try_files $uri $uri/ /index.html;  # Перенаправляем все на index.html, если не найден файл
    }

    # Обработка кэширования статичных файлов
    location ~* \.(?:css|js|html|ico|svg|woff|woff2|ttf|eot|otf|png|jpe?g|gif|webp|json|mp4|wav|mp3|m4a|ogv|webm|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        include /etc/nginx/security-headers.conf;
    }
