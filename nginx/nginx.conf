worker_processes 1;
# Уровень warn — чтобы в лог попадали отказы по лимитам частоты (limit_req_log_level warn ниже); без него
# nginx пишет только ошибки, и срабатывания лимитов не видно.
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {

	include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # Сжатие: без gzip_types nginx сжимает только HTML, а бандл (~1,2 МБ) и стили уходили как есть.
    # gzip_proxied any — ответы API (JSON каталога, карточек) тоже.
    gzip  on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    server_tokens off;
    # Docker embedded DNS — для динамического резолвинга upstream'ов (см. /api ниже)
    resolver 127.0.0.11 valid=10s ipv6=off;
    keepalive_requests 100000;
    reset_timedout_connection on;
    # Было 0 (без ограничений): любой мог слать запрос произвольного размера. 60 МБ покрывают
    # вложения поддержки и импорт данных (по 50 МБ); большие видео медиатеки — в своих локациях ниже.
    client_max_body_size 60m;
    proxy_max_temp_file_size 0;

    # --- Лимиты частоты по адресу клиента ---
    # Защита от скриптов, которые без пауз дёргают API, перебирают формы или выкачивают трейлеры.
    # Обычный посетитель до лимитов не доходит: открытие страницы — 10–25 запросов разом (их покрывает
    # запас burst в локациях), дальше — единицы в секунду. Лишний запрос сразу получает 429, не доходя
    # до бэкенда; витрина такой ответ тихо повторяет (services/api-client.ts).
    # Адрес — $binary_remote_addr. Если перед сервером встанет Cloudflare, настоящий адрес посетителя
    # нужно брать из CF-Connecting-IP (docs/deploy.md), иначе лимит станет общим на всех.
    limit_req_status 429;
    limit_req_log_level warn;

    # API: 20 запросов в секунду с адреса.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # Запросы, которые что-то меняют (формы, корзина, отзывы, оплата), — строже. У GET/HEAD/OPTIONS
    # ключ пустой, и эти зоны их не считают.
    map $request_method $write_limit_key {
        default $binary_remote_addr;
        GET     "";
        HEAD    "";
        OPTIONS "";
    }
    limit_req_zone $write_limit_key zone=api_write:10m rate=5r/s;
    # Формы Keycloak (вход, регистрация, сброс пароля, выдача токенов). Перебор паролей Keycloak
    # останавливает и сам (10 неудач подряд); эта зона — от потока запросов.
    limit_req_zone $write_limit_key zone=auth_write:10m rate=2r/s;

    # Кусочки трейлеров (HLS). На старте плеер набирает запас вперёд: замер — ~70 кусочков (видео и звук
    # отдельно) за первые 8 секунд одного ролика, дальше — около кусочка в секунду. 30 в секунду с запасом
    # 300 (в locations.conf) пропускают 3–4 ролика, запущенных разом, и десятки играющих вкладок; скрипт,
    # выкачивающий все трейлеры подряд, упирается. Картинки этой зоной не считаются (ключ пустой).
    map $uri $video_limit_key {
        default              "";
        ~*\.(m4s|m3u8)$      $binary_remote_addr;
    }
    limit_req_zone $video_limit_key zone=video:10m rate=30r/s;

    # Обложки и загрузки, которые отдаёт бэкенд (/uploads/), — щедро: главная показывает до сотни
    # обложек разом. Лимит здесь — от выкачивания, а не от обычного просмотра.
    limit_req_zone $binary_remote_addr zone=media:10m rate=60r/s;
    
    proxy_redirect off;
    proxy_set_header Host               $http_host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $forwarded_proto;
    proxy_set_header X-Forwarded-Host   $http_host;
    proxy_set_header X-Forwarded-Server $http_host;
    proxy_set_header X-Scheme           $scheme;
    proxy_connect_timeout 100s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffers 4 256k;
    proxy_buffer_size 128k;
    proxy_busy_buffers_size 256k;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 256k;

    # Пришёл ли запрос от доверенного внешнего прокси (системный nginx сервера, CDN): адреса — из
    # TALESHOP_TRUSTED_PROXY, файл пишет docker-entrypoint.d/36-taleshop-real-ip.sh (по умолчанию пустой).
    # $realip_remote_addr — адрес самого соединения, до подмены на адрес посетителя.
    geo $realip_remote_addr $from_trusted_proxy {
        default 0;
        include /etc/nginx/trusted-proxies.conf;
    }

    # Схема для бэкенда: за прокси, снявшим TLS, запрос сюда приходит по http, а посетитель — на https. Схеме из
    # заголовка верим только от доверенного прокси: иначе любой клиент назвался бы https (Secure у cookie, ссылки).
    map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
        "1:https" https;
        default   $scheme;
    }

    # HSTS — только для HTTPS: свой TLS (продакшен, nginx снимает его сам) или доверенный прокси на https.
    # На http-стенде заголовка нет.
    map $forwarded_proto $hsts_header {
        https   "max-age=31536000";
        default "";
    }

    # Сервер (порт, домен, TLS) — из шаблона /etc/nginx/site-templates/site.{dev,prod}.conf.template:
    # при старте контейнера его выбирает и разворачивает docker-entrypoint.d/15-taleshop-site.envsh.
    include /etc/nginx/conf.d/*.conf;
}
