# Защитные заголовки. Подключаются и на уровне server, и в каждой location со своим add_header:
# nginx не наследует add_header, если в location есть хоть один свой, и без повторного include
# index.html и статика ушли бы без них.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Встраивать сайт в чужие фреймы нельзя (кликджекинг); исключение — Telegram, где открывается мини-приложение.
add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; object-src 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS — только когда до прокси дошли по HTTPS (TLS снимает внешний балансировщик или CDN).
add_header Strict-Transport-Security $hsts_header always;
